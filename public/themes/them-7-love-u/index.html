<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة خاصة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0c0000;
            color: #ff0033;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* حاويات الشاشات */
        .screen {
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .hidden {
            display: none !important;
        }

        /* الشاشة الأولى */
        .name {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #ff0033;
            animation: pulse 2s infinite alternate;
            word-wrap: break-word;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 15px #ff0033; }
            100% { transform: scale(1.05); text-shadow: 0 0 30px #ff0033, 0 0 40px #ff0000; }
        }

        .buttons-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 60px;
            position: relative;
            width: 100%;
        }

        .btn {
            background-color: transparent;
            color: #ff0033;
            border: 2px solid #ff0033;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.3);
            font-family: inherit;
        }

        .btn-yes {
            transition: all 0.2s ease;
            z-index: 10;
        }

        .btn-yes:hover, .btn-yes:active {
            background-color: #ff0033;
            color: #000;
            box-shadow: 0 0 25px #ff0033;
            transform: scale(1.1);
        }

        /* زر لا بهروب سلس وأنيميشن */
        .btn-no {
            transition: top 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 20;
        }

        /* الشاشة الثانية */
        #screen2 {
            gap: 20px;
        }

        .message-box {
            background: rgba(255, 0, 51, 0.1);
            border: 2px solid #ff0033;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.2);
            backdrop-filter: blur(5px);
            max-width: 500px;
            width: 100%;
            animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            min-height: 150px;
        }

        .message-text {
            font-size: 1.5rem;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            white-space: pre-wrap;
        }

        .sender-text {
            font-size: 1.2rem;
            color: #ff0033;
            font-weight: bold;
            border-top: 1px solid rgba(255, 0, 51, 0.3);
            padding-top: 15px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 🎵 تنسيقات مشغل الموسيقى */
        .player-card { width: 100%; max-width: 500px; background: rgba(255, 0, 51, 0.05); border: 2px solid rgba(255, 0, 51, 0.4); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(255, 0, 51, 0.1); z-index: 15; animation: popIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .progress-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; direction: ltr; }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; position: relative; cursor: pointer; touch-action: none; }
        .progress-current { width: 0%; height: 100%; background: #ff0033; border-radius: 10px; box-shadow: 0 0 10px #ff0033; position: relative; pointer-events: none; }
        .progress-knob { position: absolute; right: -7px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.2s, transform 0.1s; pointer-events: auto; }
        .progress-bar:hover .progress-knob, .progress-bar:active .progress-knob, .progress-knob.dragging { opacity: 1; transform: translateY(-50%) scale(1.2); }
        .time-info { display: flex; justify-content: space-between; color: rgba(255,255,255,0.8); font-size: 0.85rem; font-weight: bold; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 25px; width: 100%; direction: ltr; }
        .control-btn { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; transition: color 0.2s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));}
        .control-btn:active { color: #ff0033; }
        .play-pause { width: 60px; height: 60px; background: #fff; color: #ff0033; border: 3px solid #ff0033; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; box-shadow: 0 4px 0 rgba(200, 0, 30, 0.6); cursor: pointer; transition: all 0.1s ease; }
        .play-pause:active { transform: translateY(4px); box-shadow: 0 0px 0 rgba(200, 0, 30, 0.6); }

        /* 🌟 الكلمات اللانهائية التي تبدأ حتماً من أقصى أعلى الشاشة خارج الرؤية */
        .love-text {
            position: fixed;
            top: -60px;
            color: #ff0033;
            font-weight: 900;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            text-shadow: 0 0 15px #ff0033;
            animation: fallDown linear forwards;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(115vh) translateX(15vw) scale(1.4); opacity: 0; }
        }

        /* 🌟 تأثير النقر (القلوب وكلمة love u) */
        .click-float {
            position: absolute;
            pointer-events: none;
            color: #ff0033;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 0, 51, 0.8);
            animation: clickFloatAnim 1s ease-out forwards;
            z-index: 9999;
        }

        @keyframes clickFloatAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--random-x)), -80px) scale(1.3); opacity: 0; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الشاشة الأولى -->
    <div id="screen1" class="screen">
        <h1 class="name" id="recipientName">جاري التحميل...</h1>
        <div class="buttons-wrapper">
            <button class="btn btn-yes" onclick="showScreen2()">أكييدد</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveNoButton()" ontouchstart="moveNoButton(event)">لا 😑</button>
        </div>
    </div>

    <!-- الشاشة الثانية -->
    <div id="screen2" class="screen hidden">
        <div class="message-box">
            <div class="message-text" id="messageText"></div>
            <div class="sender-text" id="senderText"></div>
        </div>

        <!-- مشغل الموسيقى -->
        <div class="player-card" id="musicCard" style="display: none;">
            <div style="color: #fff; font-weight: bold; margin-bottom: 15px; font-size: 1.1rem;">🎵 أغنيتنا</div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-current" id="progressCurrent">
                        <div class="progress-knob" id="progressKnob"></div> 
                    </div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="durationTime">0:00</span>
                </div>
            </div>
            <div class="controls">
                <button class="control-btn" onclick="seekAudio(-10)">⏮</button>
                <div class="play-pause" id="playPauseBtn">⏸</div>
                <button class="control-btn" onclick="seekAudio(10)">⏭</button>
            </div>
        </div>
    </div>

    <div id="youtube-container" style="display: none;"></div>

    <!-- زر إخلاء المسؤولية -->
    <button onclick="document.getElementById('info-modal-overlay').style.display='flex'" style="position: fixed; bottom: 25px; left: 25px; width: 50px; height: 50px; border-radius: 50%; background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #dc2626; font-size: 22px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 99999; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); transition: all 0.3s ease;">
        📜
    </button>

    <!-- نافذة الشروط وإخلاء المسؤولية -->
    <div id="info-modal-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100000; display: none; justify-content: center; align-items: center; direction: rtl; padding: 20px; box-sizing: border-box;">
        <div style="background: #ffffff; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 35px 25px; text-align: center; position: relative;">
            <button onclick="document.getElementById('info-modal-overlay').style.display='none'" style="position: absolute; top: 20px; right: 20px; background: #f1f5f9; border: 1px solid #e2e8f0; width: 36px; height: 36px; border-radius: 50%; color: #64748b; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center;">✕</button>
            <div style="font-size: 45px; margin-bottom: 10px;">🛡️</div>
            <h3 style="color: #1e293b; font-size: 22px; margin-top: 0; margin-bottom: 5px; font-weight: 900;">إخلاء مسؤولية</h3>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">يرجى قراءة الشروط التالية</p>
            <div style="text-align: right; display: flex; flex-direction: column; gap: 15px; background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 25px;">
                <div style="display: flex; gap: 10px; align-items: flex-start;"><span style="color: #dc2626;">⚠️</span><p style="color: #334155; font-size: 13px; margin: 0; font-weight: bold;">تخلي منصة "أمنية" مسؤوليتها الكاملة عن أي استخدام سيء، غير أخلاقي، أو غير قانوني لمواقعنا وثيماتنا.</p></div>
                <div style="display: flex; gap: 10px; align-items: flex-start;"><span style="color: #dc2626;">©️</span><p style="color: #334155; font-size: 13px; margin: 0; font-weight: bold;">جميع الثيمات مسجلة بحقوق طبع ونشر.</p></div>
            </div>
        </div>
    </div>

    <script>
        // 🌟 سحب البيانات من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const recipient = urlParams.get('recipient') || 'حبيبتي';
        const sender = urlParams.get('sender') || 'مجهول';
        const message = (urlParams.get('message') || 'أحبج هواية ومستحيل أستغني عنج ❤️').replace(/\n/g, '<br>');
        const gender = urlParams.get('gender') || 'female';
        
        // 🌟 تجهيز صيغة السؤال
        const isMale = (gender === 'male' || gender === 'ذكر');
        const loveWord = isMale ? "تحب" : "تحبين";
        document.getElementById('recipientName').innerText = `${recipient} ${loveWord} ${sender} ؟`;

        // 🌟 تأثير النقر (ظهور love u وقلوب)
        document.addEventListener('click', function(e) {
            // منع التأثير عند النقر على الأزرار أو المشغل حتى ما يزعج المستخدم
            if(e.target.closest('.btn') || e.target.closest('.controls') || e.target.closest('.progress-container') || e.target.closest('button')) return;

            const items = ['love u', '❤️', '💕'];
            
            // توليد 3 عناصر صغيرة بكل ضغطة
            for (let i = 0; i < 3; i++) {
                const el = document.createElement('div');
                el.className = 'click-float';
                el.innerText = items[Math.floor(Math.random() * items.length)];
                
                el.style.left = e.clientX + 'px';
                el.style.top = e.clientY + 'px';
                
                // مسار عشوائي لكل عنصر يمين ويسار
                const randomX = (Math.random() * 80 - 40) + 'px';
                el.style.setProperty('--random-x', randomX);
                el.style.animationDelay = (i * 0.1) + 's';
                
                document.body.appendChild(el);
                
                // إزالة العنصر بعد انتهاء الأنيميشن
                setTimeout(() => { el.remove(); }, 1200 + (i * 100));
            }
        });

        // 🌟 برمجة زر "لا" الهارب السلس
        const noBtn = document.getElementById('noBtn');
        let isFirstMove = true;

        function moveNoButton(e) {
            if (e) e.preventDefault();
            if (isFirstMove) {
                noBtn.style.position = 'fixed';
                isFirstMove = false;
            }
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // 🌟 تأثير الآلة الكاتبة
        function typeWriter(element, text, index, callback) {
            if (index < text.length) {
                if (text.charAt(index) === '<') {
                    let endIndex = text.indexOf('>', index);
                    if (endIndex !== -1) {
                        element.innerHTML += text.substring(index, endIndex + 1);
                        index = endIndex + 1;
                        setTimeout(() => typeWriter(element, text, index, callback), 40);
                        return;
                    }
                }
                element.innerHTML += text.charAt(index);
                setTimeout(() => typeWriter(element, text, index + 1, callback), 40);
            } else if (callback) { 
                callback(); 
            }
        }

        // 🌟 الانتقال للشاشة الثانية
        function showScreen2() {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.remove('hidden');

            const msgBox = document.getElementById('messageText');
            msgBox.innerHTML = ''; 
            
            typeWriter(msgBox, message, 0, function() {
                const senderEl = document.getElementById('senderText');
                senderEl.innerText = `من: ${sender}`;
                senderEl.style.opacity = 1;
            });

            startLoveStream();
            initAudio();
        }

        // 🌟 الكلمات اللانهائية من أعلى الشاشة حصراً
        function startLoveStream() {
            setInterval(createLoveText, 300); // إطلاق كلمة جديدة كل 0.3 ثانية من أعلى الشاشة
        }

        function createLoveText() {
            const el = document.createElement('div');
            el.classList.add('love-text');
            const phrases = ['LOVE YOU', 'أحبج', 'عشقي', '❤️', 'أعشقج'];
            el.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            const fontSize = Math.floor(Math.random() * 20) + 20; 
            el.style.fontSize = `${fontSize}px`;
            
            // 🌟 ضمان البداية من أعلى الشاشة فقط وخارج حدود الرؤية العلوي
            const startX = Math.random() * (window.innerWidth - 80);
            el.style.left = `${Math.max(10, startX)}px`;
            el.style.top = `-50px`; 

            const duration = Math.random() * 4 + 3; 
            el.style.animationDuration = `${duration}s`;
            document.body.appendChild(el);
            setTimeout(() => { el.remove(); }, duration * 1000);
        }

        // 🌟 نظام الصوت والعداد
        const rawAudioUrl = urlParams.get('yt_clean') || urlParams.get('yt') || '';
        let startTime = parseInt(urlParams.get('start')) || 0;
        if (startTime === 0) {
            const match = rawAudioUrl.match(/[?&]start=(\d+)/);
            if (match) startTime = parseInt(match[1]);
        }

        const hasAudio = rawAudioUrl.trim().length > 0;
        const isMp3File = rawAudioUrl.toLowerCase().includes('.mp3') || rawAudioUrl.includes('supabase.co');
        
        let ytPlayer = null;
        let localAudio = null;
        let progressInterval;
        let isDragging = false;

        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressCurrent = document.getElementById('progressCurrent');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const progressKnob = document.getElementById('progressKnob');

        function initAudio() {
            if (!hasAudio) return;
            document.getElementById('musicCard').style.display = 'flex';

            if (isMp3File) {
                localAudio = new Audio(rawAudioUrl);
                localAudio.currentTime = startTime;
                localAudio.play().catch(e=>console.log(e));
                playPauseBtn.innerText = '⏸';
                startProgressTracker();
            } else {
                function getYoutubeId(url) {
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = url.match(regExp);
                    return (match && match[2].length === 11) ? match[2] : 'dQw4w9WgXcQ';
                }
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = function() {
                    let ytContainer = document.createElement('div');
                    ytContainer.id = 'yt-audio-player';
                    document.getElementById('youtube-container').appendChild(ytContainer);
                    
                    ytPlayer = new YT.Player('yt-audio-player', {
                        videoId: getYoutubeId(rawAudioUrl),
                        playerVars: { 'autoplay': 1, 'controls': 0, 'start': startTime, 'playsinline': 1 },
                        events: {
                            'onReady': (e) => { e.target.playVideo(); playPauseBtn.innerText = '⏸'; startProgressTracker(); },
                            'onStateChange': (e) => { 
                                if(e.data === YT.PlayerState.PLAYING) playPauseBtn.innerText = '⏸';
                                else if (e.data === YT.PlayerState.ENDED) { ytPlayer.seekTo(startTime, true); ytPlayer.playVideo(); }
                                else playPauseBtn.innerText = '▶';
                            }
                        }
                    });
                }
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (isMp3File && localAudio) {
                if (localAudio.paused) { localAudio.play(); playPauseBtn.innerText = '⏸'; }
                else { localAudio.pause(); playPauseBtn.innerText = '▶'; }
            } else if (!isMp3File && ytPlayer) {
                const state = ytPlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); playPauseBtn.innerText = '▶'; }
                else { ytPlayer.playVideo(); playPauseBtn.innerText = '⏸'; }
            }
        });

        function seekAudio(seconds) {
            if (isMp3File && localAudio) localAudio.currentTime += seconds;
            else if (!isMp3File && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') ytPlayer.seekTo(ytPlayer.getCurrentTime() + seconds, true);
        }

        function startProgressTracker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (isDragging) return; 
                let currentTime = 0, actualDuration = 0;
                if (isMp3File && localAudio) { currentTime = localAudio.currentTime; actualDuration = localAudio.duration || 200; }
                else if (!isMp3File && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') { currentTime = ytPlayer.getCurrentTime() || 0; actualDuration = ytPlayer.getDuration() || 200; }
                else return;

                const totalDuration = actualDuration - startTime;
                const currentProgress = currentTime - startTime;
                const progressPercent = Math.max(0, Math.min(100, (currentProgress / totalDuration) * 100));
                
                progressCurrent.style.width = `${progressPercent}%`;

                let displayTime = Math.max(0, currentTime - startTime);
                currentTimeEl.innerText = `${Math.floor(displayTime / 60)}:${Math.floor(displayTime % 60).toString().padStart(2, '0')}`;
                durationTimeEl.innerText = `${Math.floor(totalDuration / 60)}:${Math.floor(totalDuration % 60).toString().padStart(2, '0')}`;
            }, 500);
        }

        function updateProgressFromEvent(e) {
            const rect = progressBar.getBoundingClientRect();
            let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            let percent = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            progressCurrent.style.width = percent + '%';
            return percent;
        }

        function seekToPercent(percent) {
            let actualDuration = 200;
            if (isMp3File && localAudio) actualDuration = localAudio.duration || 200;
            else if (!isMp3File && ytPlayer) actualDuration = ytPlayer.getDuration() || 200;

            const newTime = startTime + ((percent / 100) * (actualDuration - startTime));
            if (isMp3File && localAudio) { localAudio.currentTime = newTime; if(localAudio.paused) localAudio.play(); }
            else if (!isMp3File && ytPlayer) { ytPlayer.seekTo(newTime, true); ytPlayer.playVideo(); }
            playPauseBtn.innerText = '⏸';
        }

        progressBar.addEventListener('mousedown', (e) => { isDragging = true; progressKnob.classList.add('dragging'); updateProgressFromEvent(e); });
        document.addEventListener('mousemove', (e) => { if (isDragging) updateProgressFromEvent(e); });
        document.addEventListener('mouseup', (e) => { if (isDragging) { seekToPercent(updateProgressFromEvent(e)); isDragging = false; progressKnob.classList.remove('dragging'); } });
        progressBar.addEventListener('touchstart', (e) => { isDragging = true; progressKnob.classList.add('dragging'); updateProgressFromEvent(e); }, {passive: true});
        document.addEventListener('touchmove', (e) => { if (isDragging) updateProgressFromEvent(e); }, {passive: true});
        document.addEventListener('touchend', (e) => { if (isDragging) { seekToPercent(updateProgressFromEvent(e)); isDragging = false; progressKnob.classList.remove('dragging'); } });
    </script>
</body>
</html>
