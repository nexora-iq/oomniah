<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفاجأة خاصة لك ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fdf2f8; 
            font-family: 'Tajawal', "Nunito", sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* حاويات الشاشات */
        .screen {
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .hidden {
            display: none !important;
        }

        /* 🌟 الشاشة الأولى */
        .gif_container img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 10px;
            filter: drop-shadow(0 10px 15px rgba(211, 47, 47, 0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            color: #d32f2f;
            margin: 20px 0;
            word-wrap: break-word;
            font-weight: 900;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
            padding: 0 10px;
        }

        /* زر التأكيد (يكبر تدريجياً) */
        .yes-button {
            font-size: 1.5rem;
            padding: 12px 35px;
            background-color: #fa0561;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 90vw;
            word-break: break-word;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(250, 5, 97, 0.3);
            z-index: 10;
        }

        .yes-button:hover, .yes-button:active {
            background-color: #e03777;
        }

        /* زر لا ثابت */
        .no-button {
            font-size: 1.2rem;
            padding: 12px 25px;
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            max-width: 90vw;
            word-break: break-word;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            transition: all 0.2s ease;
            z-index: 10;
        }

        /* 🌟 الشاشة الثانية */
        #screen2 {
            animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .header_text {
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            color: #d32f2f;
            margin-bottom: 20px;
            word-wrap: break-word;
            font-weight: 900;
        }

        .message-box {
            background: #ffffff;
            border: 2px solid #fbcfe8;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.1);
            max-width: 500px;
            width: 100%;
            margin-bottom: 25px;
        }

        .message-text {
            font-size: 1.3rem;
            color: #334155;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
            font-weight: 700;
        }

        .sender-text {
            font-size: 1.1rem;
            color: #fa0561;
            font-weight: 900;
            border-top: 2px dashed #fbcfe8;
            padding-top: 15px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* 🎵 مشغل الموسيقى */
        .player-card { width: 100%; max-width: 500px; background: #ffffff; border: 2px solid #fbcfe8; border-radius: 20px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(211, 47, 47, 0.1); z-index: 15; }
        .progress-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; direction: ltr; }
        .progress-bar { width: 100%; height: 8px; background: #f1f5f9; border-radius: 10px; position: relative; cursor: pointer; touch-action: none; }
        .progress-current { width: 0%; height: 100%; background: #fa0561; border-radius: 10px; position: relative; pointer-events: none; }
        .progress-knob { position: absolute; right: -7px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.2s, transform 0.1s; pointer-events: auto; }
        .progress-bar:hover .progress-knob, .progress-bar:active .progress-knob, .progress-knob.dragging { opacity: 1; transform: translateY(-50%) scale(1.2); }
        .time-info { display: flex; justify-content: space-between; color: #64748b; font-size: 0.85rem; font-weight: bold; }
        .controls { display: flex; align-items: center; justify-content: center; gap: 25px; width: 100%; direction: ltr; }
        .control-btn { background: none; border: none; color: #94a3b8; font-size: 1.6rem; cursor: pointer; transition: color 0.2s; }
        .control-btn:active { color: #fa0561; }
        .play-pause { width: 55px; height: 55px; background: #fa0561; color: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; box-shadow: 0 4px 15px rgba(250, 5, 97, 0.4); cursor: pointer; transition: all 0.1s ease; }
        .play-pause:active { transform: translateY(4px); box-shadow: 0 0px 0 rgba(250, 5, 97, 0.4); }

        /* 🌸 الورد المتساقط بالخلفية (بطيء جداً) */
        .falling-rose {
            position: fixed;
            top: -60px;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 1; 
            opacity: 0;
            animation: fallDownSlow linear forwards;
        }

        @keyframes fallDownSlow {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
        }

        /* 🌸 الورد المتطاير عند النقر */
        .click-rose {
            position: absolute;
            pointer-events: none;
            font-size: 2rem;
            animation: clickFloatAnim 1s ease-out forwards;
            z-index: 9999; 
        }

        @keyframes clickFloatAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--random-x)), -100px) scale(1.5) rotate(20deg); opacity: 0; }
        }

        /* الكلمات اللانهائية في الشاشة الثانية */
        .love-text {
            position: fixed;
            top: -60px;
            color: #ff0033;
            font-weight: 900;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            text-shadow: 0 0 15px #ff0033;
            animation: fallDownText linear forwards;
        }

        @keyframes fallDownText {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(115vh) translateX(15vw) scale(1.4); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="screen1" class="screen">
        <div class="gif_container">
            <img src="https://gifdb.com/images/high/cute-love-bear-roses-ou7zho5oosxnpo6k.gif" alt="Cute GIF">
        </div>
        <h1 id="recipientName">جاري التحميل...</h1>
        <div class="buttons">
            <button class="yes-button" onclick="handleYesClick()">أكييدد</button>
            <button class="no-button" onclick="handleNoClick()">لا 😑</button>
        </div>
    </div>

    <div id="screen2" class="screen hidden">
        <h1 class="header_text" id="successText"></h1>
        <div class="gif_container" style="margin-bottom: 20px;">
            <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Happy Bear GIF" style="max-width: 250px;">
        </div>

        <div class="message-box">
            <div class="message-text" id="messageText"></div>
            <div class="sender-text" id="senderText"></div>
        </div>

        <div class="player-card" id="musicCard" style="display: none;">
            <div style="color: #475569; font-weight: bold; margin-bottom: 15px; font-size: 1.1rem;">🎵 أغنيتنا</div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-current" id="progressCurrent">
                        <div class="progress-knob" id="progressKnob"></div> 
                    </div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="durationTime">0:00</span>
                </div>
            </div>
            <div class="controls">
                <button class="control-btn" onclick="seekAudio(-10)">⏮</button>
                <div class="play-pause" id="playPauseBtn">⏸</div>
                <button class="control-btn" onclick="seekAudio(10)">⏭</button>
            </div>
        </div>
    </div>

    <div id="youtube-container" style="display: none;"></div>

    <button onclick="document.getElementById('info-modal-overlay').style.display='flex'" style="position: fixed; bottom: 25px; left: 25px; width: 45px; height: 45px; border-radius: 50%; background: #ffffff; border: 1px solid #fbcfe8; color: #fa0561; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 99999; box-shadow: 0 4px 15px rgba(211, 47, 47, 0.15);">
        📜
    </button>

    <div id="info-modal-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); z-index: 100000; display: none; justify-content: center; align-items: center; direction: rtl; padding: 20px; box-sizing: border-box;">
        <div style="background: #ffffff; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 35px 25px; text-align: center; position: relative;">
            <button onclick="document.getElementById('info-modal-overlay').style.display='none'" style="position: absolute; top: 20px; right: 20px; background: #f1f5f9; border: 1px solid #e2e8f0; width: 36px; height: 36px; border-radius: 50%; color: #64748b; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center;">✕</button>
            <div style="font-size: 40px; margin-bottom: 10px;">🛡️</div>
            <h3 style="color: #1e293b; font-size: 20px; margin-top: 0; margin-bottom: 5px; font-weight: 900;">إخلاء مسؤولية</h3>
            <div style="text-align: right; display: flex; flex-direction: column; gap: 15px; background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-top: 20px;">
                <div style="display: flex; gap: 10px; align-items: flex-start;"><span style="color: #dc2626;">⚠️</span><p style="color: #334155; font-size: 13px; margin: 0; font-weight: bold;">تخلي منصة "أمنية" مسؤوليتها الكاملة عن أي استخدام سيء، غير أخلاقي، أو غير قانوني لمواقعنا وثيماتنا.</p></div>
                <div style="display: flex; gap: 10px; align-items: flex-start;"><span style="color: #dc2626;">©️</span><p style="color: #334155; font-size: 13px; margin: 0; font-weight: bold;">جميع الثيمات مسجلة بحقوق طبع ونشر.</p></div>
            </div>
        </div>
    </div>

    <script>
        // 🌟 1. سحب البيانات
        const urlParams = new URLSearchParams(window.location.search);
        const recipient = urlParams.get('recipient') || '[المستلم]';
        const sender = urlParams.get('sender') || '[المرسل]';
        const message = (urlParams.get('message') || 'أحبك هواية ومستحيل أستغني عنك ❤️').replace(/\n/g, '<br>');
        const gender = urlParams.get('gender') || 'female';
        
        // 🌟 2. تخصيص النصوص حسب الجنس
        const isMale = (gender === 'male' || gender === 'ذكر');
        const loveWord = isMale ? "تحب" : "تحبين";
        
        // الشاشة الأولى
        document.getElementById('recipientName').innerText = `${recipient} ${loveWord} ${sender} ؟ 🙈`;
        
        // الشاشة الثانية
        const successPrefix = isMale ? "كنت متأكد رح تكول أي!" : "كنت متأكد رح تكولين أي!";
        document.getElementById('successText').innerHTML = `${successPrefix} ❤️`;

        // 🌟 3. نصوص زر No (و تكبير زر Yes)
        const messages = isMale ? [
            "متأكد ؟", "لتزعل 🥺", "أحبك ❤️", "فكر زين!", "بدون شقة 🙄"
        ] : [
            "متأكدة ؟", "لتزعلين 🥺", "أحبج ❤️", "فكري زين!", "بدون شقة 🙄"
        ];

        let messageIndex = 0;

        function handleNoClick() {
            const noButton = document.querySelector('.no-button');
            const yesButton = document.querySelector('.yes-button');
            
            // تغيير النص
            noButton.textContent = messages[messageIndex];
            messageIndex = (messageIndex + 1) % messages.length;
            
            // تكبير زر نعم
            const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
            if (currentSize < 60) {
                yesButton.style.fontSize = `${currentSize * 1.3}px`; 
                yesButton.style.padding = `${currentSize * 0.8}px ${currentSize * 2}px`;
            }
        }

        // 🌟 4. الورد المتساقط البطيء في الخلفية
        function startFallingRoses() {
            setInterval(() => {
                const roses = ['🌹', '🌸', '🌺', '🌻', '🌷'];
                const el = document.createElement('div');
                el.className = 'falling-rose';
                el.innerText = roses[Math.floor(Math.random() * roses.length)];
                
                const startX = Math.random() * window.innerWidth;
                el.style.left = `${startX}px`;
                
                const duration = Math.random() * 5 + 8; // نزول بطيء
                el.style.animationDuration = `${duration}s`;
                
                document.body.appendChild(el);
                setTimeout(() => { el.remove(); }, duration * 1000);
            }, 800);
        }
        startFallingRoses();

        // 🌟 5. الورد المتطاير العشوائي عند النقر
        document.addEventListener('click', function(e) {
            if(e.target.closest('.btn') || e.target.closest('.controls') || e.target.closest('.progress-container') || e.target.closest('button')) return;

            const roses = ['🌹', '🌸', '🌺', '🌻', '🌷'];
            const count = Math.floor(Math.random() * 4) + 1; // 1 إلى 4 وردات
            
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'click-rose';
                el.innerText = roses[Math.floor(Math.random() * roses.length)];
                
                el.style.left = e.clientX + 'px';
                el.style.top = e.clientY + 'px';
                
                const randomX = (Math.random() * 120 - 60) + 'px'; 
                el.style.setProperty('--random-x', randomX);
                el.style.animationDelay = (i * 0.05) + 's';
                
                document.body.appendChild(el);
                
                setTimeout(() => { el.remove(); }, 1000 + (i * 100));
            }
        });

        // 🌟 6. الانتقال والآلة الكاتبة
        function typeWriter(element, text, index, callback) {
            if (index < text.length) {
                if (text.charAt(index) === '<') {
                    let endIndex = text.indexOf('>', index);
                    if (endIndex !== -1) {
                        element.innerHTML += text.substring(index, endIndex + 1);
                        index = endIndex + 1;
                        setTimeout(() => typeWriter(element, text, index, callback), 40);
                        return;
                    }
                }
                element.innerHTML += text.charAt(index);
                setTimeout(() => typeWriter(element, text, index + 1, callback), 40);
            } else if (callback) { 
                callback(); 
            }
        }

        function handleYesClick() {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.remove('hidden');

            const msgBox = document.getElementById('messageText');
            msgBox.innerHTML = ''; 
            
            typeWriter(msgBox, message, 0, function() {
                const senderEl = document.getElementById('senderText');
                senderEl.innerText = `من: ${sender}`;
                senderEl.style.opacity = 1;
            });

            startLoveStream();
            initAudio();
        }

        // كلمات LOVE YOU في الشاشة الثانية
        function startLoveStream() {
            setInterval(() => {
                const el = document.createElement('div');
                el.classList.add('love-text');
                const phrases = isMale ? ['أحبك', 'عشقي', '❤️', 'أعشقك'] : ['أحبج', 'عشقي', '❤️', 'أعشقج'];
                el.innerText = phrases[Math.floor(Math.random() * phrases.length)];
                el.style.fontSize = `${Math.floor(Math.random() * 20) + 20}px`;
                el.style.left = `${Math.max(10, Math.random() * (window.innerWidth - 80))}px`;
                const duration = Math.random() * 4 + 3; 
                el.style.animationDuration = `${duration}s`;
                document.body.appendChild(el);
                setTimeout(() => { el.remove(); }, duration * 1000);
            }, 300);
        }

        // 🌟 7. مشغل الموسيقى
        const rawAudioUrl = urlParams.get('yt_clean') || urlParams.get('yt') || '';
        let startTime = parseInt(urlParams.get('start')) || 0;
        if (startTime === 0) {
            const match = rawAudioUrl.match(/[?&]start=(\d+)/);
            if (match) startTime = parseInt(match[1]);
        }

        const hasAudio = rawAudioUrl.trim().length > 0;
        const isMp3File = rawAudioUrl.toLowerCase().includes('.mp3') || rawAudioUrl.includes('supabase.co');
        
        let ytPlayer = null;
        let localAudio = null;
        let progressInterval;
        let isDragging = false;

        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressCurrent = document.getElementById('progressCurrent');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const progressKnob = document.getElementById('progressKnob');

        function initAudio() {
            if (!hasAudio) return;
            document.getElementById('musicCard').style.display = 'flex';

            if (isMp3File) {
                localAudio = new Audio(rawAudioUrl);
                localAudio.currentTime = startTime;
                localAudio.play().catch(e=>console.log(e));
                playPauseBtn.innerText = '⏸';
                startProgressTracker();
            } else {
                function getYoutubeId(url) {
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = url.match(regExp);
                    return (match && match[2].length === 11) ? match[2] : 'dQw4w9WgXcQ';
                }
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = function() {
                    let ytContainer = document.createElement('div');
                    ytContainer.id = 'yt-audio-player';
                    document.getElementById('youtube-container').appendChild(ytContainer);
                    
                    ytPlayer = new YT.Player('yt-audio-player', {
                        videoId: getYoutubeId(rawAudioUrl),
                        playerVars: { 'autoplay': 1, 'controls': 0, 'start': startTime, 'playsinline': 1 },
                        events: {
                            'onReady': (e) => { e.target.playVideo(); playPauseBtn.innerText = '⏸'; startProgressTracker(); },
                            'onStateChange': (e) => { 
                                if(e.data === YT.PlayerState.PLAYING) playPauseBtn.innerText = '⏸';
                                else if (e.data === YT.PlayerState.ENDED) { ytPlayer.seekTo(startTime, true); ytPlayer.playVideo(); }
                                else playPauseBtn.innerText = '▶';
                            }
                        }
                    });
                }
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (isMp3File && localAudio) {
                if (localAudio.paused) { localAudio.play(); playPauseBtn.innerText = '⏸'; }
                else { localAudio.pause(); playPauseBtn.innerText = '▶'; }
            } else if (!isMp3File && ytPlayer) {
                const state = ytPlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); playPauseBtn.innerText = '▶'; }
                else { ytPlayer.playVideo(); playPauseBtn.innerText = '⏸'; }
            }
        });

        function seekAudio(seconds) {
            if (isMp3File && localAudio) localAudio.currentTime += seconds;
            else if (!isMp3File && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') ytPlayer.seekTo(ytPlayer.getCurrentTime() + seconds, true);
        }

        function startProgressTracker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (isDragging) return; 
                let currentTime = 0, actualDuration = 0;
                if (isMp3File && localAudio) { currentTime = localAudio.currentTime; actualDuration = localAudio.duration || 200; }
                else if (!isMp3File && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') { currentTime = ytPlayer.getCurrentTime() || 0; actualDuration = ytPlayer.getDuration() || 200; }
                else return;

                const totalDuration = actualDuration - startTime;
                const currentProgress = currentTime - startTime;
                const progressPercent = Math.max(0, Math.min(100, (currentProgress / totalDuration) * 100));
                
                progressCurrent.style.width = `${progressPercent}%`;

                let displayTime = Math.max(0, currentTime - startTime);
                currentTimeEl.innerText = `${Math.floor(displayTime / 60)}:${Math.floor(displayTime % 60).toString().padStart(2, '0')}`;
                durationTimeEl.innerText = `${Math.floor(totalDuration / 60)}:${Math.floor(totalDuration % 60).toString().padStart(2, '0')}`;
            }, 500);
        }

        function updateProgressFromEvent(e) {
            const rect = progressBar.getBoundingClientRect();
            let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            let percent = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            progressCurrent.style.width = percent + '%';
            return percent;
        }

        function seekToPercent(percent) {
            let actualDuration = 200;
            if (isMp3File && localAudio) actualDuration = localAudio.duration || 200;
            else if (!isMp3File && ytPlayer) actualDuration = ytPlayer.getDuration() || 200;

            const newTime = startTime + ((percent / 100) * (actualDuration - startTime));
            if (isMp3File && localAudio) { localAudio.currentTime = newTime; if(localAudio.paused) localAudio.play(); }
            else if (!isMp3File && ytPlayer) { ytPlayer.seekTo(newTime, true); ytPlayer.playVideo(); }
            playPauseBtn.innerText = '⏸';
        }

        progressBar.addEventListener('mousedown', (e) => { isDragging = true; progressKnob.classList.add('dragging'); updateProgressFromEvent(e); });
        document.addEventListener('mousemove', (e) => { if (isDragging) updateProgressFromEvent(e); });
        document.addEventListener('mouseup', (e) => { if (isDragging) { seekToPercent(updateProgressFromEvent(e)); isDragging = false; progressKnob.classList.remove('dragging'); } });
        progressBar.addEventListener('touchstart', (e) => { isDragging = true; progressKnob.classList.add('dragging'); updateProgressFromEvent(e); }, {passive: true});
        document.addEventListener('touchmove', (e) => { if (isDragging) updateProgressFromEvent(e); }, {passive: true});
        document.addEventListener('touchend', (e) => { if (isDragging) { seekToPercent(updateProgressFromEvent(e)); isDragging = false; progressKnob.classList.remove('dragging'); } });
    </script>
</body>
</html>
